<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vantage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>window.Chart || document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"><\/script>');</script>
<style>
  :root{
    --bg:#0e1118; --bg2:#131721; --surface:#181d29; --surface2:#1f2534; --line:#293040; --line2:#343c4f;
    --text:#e9ecf3; --muted:#8f97ab; --faint:#5f677a;
    --accent:#2dd4bf; --accent-ink:#0b2f2b;
    --good:#34d399; --warn:#fbbf24; --crit:#fb7185; --info:#60a5fa;
    --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;padding:0 26px 60px}
  @media (max-width:600px){body{padding:0 16px 40px}}
  button{font-family:inherit;color:inherit}
  ::selection{background:var(--accent);color:var(--accent-ink)}

  /* ---------- top: brand + ask ---------- */
  .top{max-width:1360px;margin:0 auto;padding-top:18px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .brand .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#60a5fa);display:grid;place-items:center;color:#06201d;font-weight:800;font-size:14px}
  .brand b{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .brand span{color:var(--faint);font-size:12.5px}
  .brand .pulse{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase}
  .brand .pulse i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

  .ask{max-width:820px;margin:0 auto}
  .ask h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px;text-align:center;text-wrap:balance}
  .ask p.lead{color:var(--muted);text-align:center;margin:0 0 16px;font-size:15px}
  .box{background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:12px 12px 10px;transition:border-color .15s,box-shadow .15s;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,212,191,.15),0 12px 40px rgba(0,0,0,.25)}
  .box textarea{width:100%;border:0;background:transparent;color:var(--text);font:inherit;font-size:16px;resize:none;outline:none;min-height:52px;max-height:180px;line-height:1.45;padding:4px 6px}
  .box textarea::placeholder{color:var(--faint)}
  .tools{display:flex;align-items:center;gap:8px;margin-top:4px}
  .ibtn{background:transparent;border:1px solid var(--line2);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:.15s}
  .ibtn:hover,.ibtn:focus-visible{border-color:var(--accent);color:var(--text);outline:none}
  .ibtn.rec{border-color:var(--crit);color:var(--crit);animation:pulse 1.4s infinite}
  .ibtn[hidden]{display:none}
  .tools .over{background:transparent;border:0;color:var(--faint);font-size:12.5px;cursor:pointer;padding:6px 8px;border-radius:8px}
  .tools .over:hover{color:var(--text);background:var(--surface2)}
  .send{margin-left:auto;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;height:36px;padding:0 18px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s}
  .send:hover{filter:brightness(1.08)}
  .send:disabled{opacity:.6;cursor:default}

  .reply{max-width:820px;margin:14px auto 0;display:flex;gap:10px;align-items:flex-start;min-height:44px}
  .reply .av{width:24px;height:24px;border-radius:7px;background:var(--surface2);border:1px solid var(--line2);display:grid;place-items:center;flex:none;color:var(--accent);font-weight:800;font-size:12px;margin-top:1px}
  .reply .txt{color:var(--muted);font-size:14px;line-height:1.5}
  .reply .txt b{color:var(--text);font-weight:700}
  .reply .cur{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
  @keyframes blink{to{opacity:0}}
  .reply .steps{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;color:var(--faint)}
  .reply .step{display:flex;align-items:center;gap:6px}
  .reply .step i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line2);display:inline-block}
  .reply .step.on{color:var(--text)}
  .reply .step.on i{border-color:var(--accent);border-top-color:transparent;animation:spin .9s linear infinite}
  .reply .step.done{color:var(--muted)}
  .reply .step.done i{background:var(--good);border-color:var(--good)}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- dashboard ---------- */
  .dash{max-width:1360px;margin:26px auto 0;transition:opacity .3s,transform .3s}
  .dash.dim{opacity:.25;transform:translateY(4px);pointer-events:none}
  .dash-head{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end;margin-bottom:12px}
  .dash-head .t{min-width:0;flex:1 1 380px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
  .dash-head h2{font-size:24px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
  .dash-head p{margin:5px 0 0;color:var(--muted);font-size:14px;max-width:72ch}
  .persona{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--text);white-space:nowrap}
  .pill .k{color:var(--faint);font-weight:500}
  .pill.ai{border-color:rgba(45,212,191,.4)}

  .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
  .section{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .section:after{content:"";flex:1;height:1px;background:var(--line)}
  .w{grid-column:span var(--w,4);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:10px;animation:rise .5s both}
  @media (max-width:1100px){.w{grid-column:span max(var(--w,4),6)}}
  @media (max-width:700px){.w{grid-column:1/-1}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.w,.reply .step.on i,.brand .pulse i,.ibtn.rec,.reply .cur{animation:none}}
  .w h3{margin:0;font-size:12.5px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .w h3 span{font-family:var(--mono);font-size:10.5px;color:var(--faint);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
  .w .chart{position:relative;height:220px;min-width:0}
  .w.tall .chart{height:250px}

  .kpi .val{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
  .kpi .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .kpi .delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:6px;padding:3px 7px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .kpi .delta.up{background:rgba(52,211,153,.13);color:var(--good)}
  .kpi .delta.down{background:rgba(251,113,133,.13);color:var(--crit)}
  .kpi .delta.flat{background:rgba(143,151,171,.13);color:var(--muted)}
  .kpi .sub{color:var(--faint);font-size:12px}
  .kpi svg{width:100%;height:38px;display:block}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap}
  td{padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
  td.num,th.num{text-align:right}
  tr:last-child td{border-bottom:0}
  .tblwrap{overflow-x:auto;margin:0 -6px}
  .tag{display:inline-block;border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:700}
  .tag.good{background:rgba(52,211,153,.14);color:var(--good)}.tag.warn{background:rgba(251,191,36,.14);color:var(--warn)}.tag.crit{background:rgba(251,113,133,.14);color:var(--crit)}.tag.info{background:rgba(96,165,250,.14);color:var(--info)}.tag.neutral{background:rgba(143,151,171,.14);color:var(--muted)}

  .list{display:flex;flex-direction:column}
  .item{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .item:last-child{border-bottom:0}
  .item i{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--muted)}
  .item.good i{background:var(--good)}.item.warn i{background:var(--warn)}.item.crit i{background:var(--crit);box-shadow:0 0 0 3px rgba(251,113,133,.18)}.item.info i{background:var(--info)}
  .item .m{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}

  .prog{display:flex;flex-direction:column;gap:10px}
  .prog .p{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
  .prog .bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
  .prog .bar b{display:block;height:100%;border-radius:99px;background:var(--accent)}
  .prog .bar b.warn{background:var(--warn)}.prog .bar b.crit{background:var(--crit)}
  .prog .v{font-family:var(--mono);font-size:12px;color:var(--muted)}

  .ins-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .ins{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.45;border-left:3px solid var(--accent)}
  .ins.warn{border-left-color:var(--warn)}.ins.crit{border-left-color:var(--crit)}.ins.good{border-left-color:var(--good)}
  .ins b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-family:var(--mono);margin-bottom:4px;font-weight:500}

  .todo{display:flex;flex-direction:column}
  .todo label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
  .todo label:last-child{border-bottom:0}
  .todo input{margin-top:3px;accent-color:var(--accent)}
  .todo input:checked+span{color:var(--faint);text-decoration:line-through}

  .toast{position:fixed;bottom:16px;right:16px;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:10px 14px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:360px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
  .toast.on{opacity:1;transform:none}
</style>

</head>
<body>
<div class="top">
  <div class="brand"><div class="mark">V</div><b>Vantage</b><span>· dashboards from a sentence</span><div class="pulse" id="status"><i></i><span>agent ready</span></div></div>
  <div class="ask">
    <h1 id="h1">Who is this dashboard for?</h1>
    <p class="lead" id="lead">Describe the person and what they need to keep an eye on. The agent designs the rest.</p>
    <div class="box">
      <textarea id="input" rows="2" placeholder="e.g. A sales manager who needs to see sales, marketing, and open customer service tickets" autofocus></textarea>
      <div class="tools">
        <button class="ibtn" id="mic" title="Speak your request" aria-label="Speak your request" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="over" id="reset" hidden>Start over</button>
        <button class="send" id="send">Build it <span aria-hidden="true">→</span></button>
      </div>
    </div>
    <div class="reply" id="reply" hidden><div class="av">V</div><div class="txt" id="replyTxt"></div></div>
  </div>
</div>

<main class="dash" id="dash" hidden>
  <div class="dash-head" id="head"></div>
  <div class="grid" id="grid"></div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  // =====================================================================
  //  DATA BANK — coherent dummy data, generated deterministically
  // =====================================================================
  const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const ser = (seed, n, base, growth, noise, dp = 0) => { const r = rng(seed); const out = []; let v = base; for (let i = 0; i < n; i++) { const jitter = 1 + (r() - 0.5) * 2 * noise; out.push(+(v * jitter).toFixed(dp)); v *= 1 + growth; } return out; };
  const MONTHS = ["Oct","Nov","Dec","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep"];
  const WEEKS = ["Jul 20","Jul 27","Aug 3","Aug 10","Aug 17","Aug 24","Aug 31","Sep 7"];
  const DAYS14 = ["Aug 29","Aug 30","Aug 31","Sep 1","Sep 2","Sep 3","Sep 4","Sep 5","Sep 6","Sep 7","Sep 8","Sep 9","Sep 10","Sep 11"];
  const money = (n) => { const a = Math.abs(n); return "$" + (a >= 1e6 ? (n / 1e6).toFixed(2) + "M" : a >= 1e3 ? (n / 1e3).toFixed(0) + "K" : n.toFixed(0)); };
  const pct = (a, b) => ((a - b) / b * 100);
  const kpiFrom = (title, s, fmtV, sub, goodUp = true, unitLabel = "") => { const last = s[s.length - 1], prev = s[s.length - 2]; const d = pct(last, prev); return { type: "kpi", title, value: fmtV(last), delta: (d >= 0 ? "+" : "") + d.toFixed(1) + "%", trend: d > 0.3 ? "up" : d < -0.3 ? "down" : "flat", good: d > 0.3 ? goodUp : d < -0.3 ? !goodUp : null, sub, spark: s.slice(-12), w: 3 }; };
  const kpi = (title, value, delta, trend, good, sub, spark) => ({ type: "kpi", title, value, delta, trend, good, sub, spark, w: 3 });

  const revenue = ser(11, 12, 690000, 0.028, 0.05);
  const target = revenue.map((v, i) => Math.round(690000 * Math.pow(1.03, i) / 1000) * 1000);
  const leadsOrganic = ser(21, 8, 420, 0.03, 0.08), leadsPaid = ser(22, 8, 310, 0.04, 0.1), leadsRef = ser(23, 8, 140, 0.02, 0.12);
  const opened = ser(31, 14, 62, 0.012, 0.18), resolved = opened.map((v, i) => Math.round(v * (i < 9 ? 1.02 : 0.86)));
  const expenses = ser(41, 12, 610000, 0.012, 0.04);
  const headcount = ser(51, 12, 118, 0.017, 0.006).map(Math.round);
  const shipped = ser(61, 14, 1180, 0.006, 0.09).map(Math.round), backlog = ser(62, 14, 260, 0.02, 0.1).map(Math.round);
  const dau = ser(71, 14, 22400, 0.008, 0.06).map(Math.round);
  const nrr = ser(81, 12, 106, 0.005, 0.01, 1);
  const stockVal = ser(91, 12, 1720000, 0.008, 0.03);

  const D = {
    sales: { name: "Sales", role: "Sales Manager", keys: ["sales","revenue","pipeline","deal","quota","booking","account exec","sdr","crm","selling","sell"],
      why: "Sales opens with revenue against target and the pipeline feeding it, since that is what a sales lead answers for first.",
      kpis: [kpiFrom("Revenue this month", revenue, money, "vs last month · target " + money(target[11]), true), kpi("Open pipeline", "$4.82M", "+6.4%", "up", true, "weighted · 3.6× coverage", [3.9,4.0,4.1,4.0,4.3,4.4,4.5,4.4,4.6,4.7,4.7,4.82]), kpi("Win rate", "31.2%", "+1.8 pts", "up", true, "closed-won, trailing 90d", [27,28,28.5,29,29.4,29,30.1,30.4,30.8,30.5,31,31.2]), kpi("Avg deal size", "$18.4K", "-2.1%", "down", false, "closed-won, trailing 90d", [19.2,19.4,19,18.9,19.1,18.7,18.8,18.6,18.9,18.5,18.8,18.4])],
      main: { type: "line", title: "Revenue vs target", w: 8, unit: "$", labels: MONTHS, series: [{ name: "Revenue", data: revenue }, { name: "Target", data: target }] },
      side: { type: "donut", title: "Revenue by region", w: 4, labels: ["West","East","Central","EMEA"], data: [34,28,22,16] },
      table: { type: "table", title: "Top open deals", w: 8, columns: ["Deal","Owner","Value","Stage","Close","Status"], rows: [["Northwind Logistics","Priya N.","$240K","Negotiation","Sep 19","good"],["Halvorsen Retail Group","Marcus T.","$185K","Proposal","Sep 26","warn"],["Cobalt Health","Dana R.","$142K","Negotiation","Sep 30","good"],["Summit Outdoor Co.","Priya N.","$96K","Qualified","Oct 8","neutral"],["Beacon Financial","Luis A.","$88K","Proposal","Oct 14","crit"],["Ridgeline Manufacturing","Marcus T.","$74K","Discovery","Oct 22","neutral"]] },
      list: { type: "list", title: "Deals needing attention", w: 4, items: [{ text: "Beacon Financial went quiet after pricing — 11 days, no reply", status: "crit", meta: "11d" }, { text: "Halvorsen legal review slipping past the Sep 26 close date", status: "warn", meta: "3d" }, { text: "Northwind verbal yes — contract out for signature", status: "good", meta: "today" }, { text: "Q3 quota at 84% with 19 days left", status: "warn", meta: "Q3" }] },
      bar: { type: "bar", title: "Pipeline by stage", w: 6, unit: "$", labels: ["Discovery","Qualified","Proposal","Negotiation"], series: [{ name: "Weighted value", data: [1920000,1310000,940000,650000] }] } },
    marketing: { name: "Marketing", role: "Marketing Manager", keys: ["marketing","campaign","lead","leads","seo","ads","advertising","brand","content","social","email","website","traffic","funnel","mql","cmo"],
      why: "Marketing shows lead flow by channel next to cost per lead, so spend decisions and hand-offs to sales sit in one place.",
      kpis: [kpi("MQLs this month", "1,284", "+9.1%", "up", true, "vs last month", [880,910,960,990,1040,1020,1110,1150,1180,1210,1177,1284]), kpi("Cost per lead", "$42", "-6.3%", "down", true, "blended, all channels", [51,50,49,48,48,47,46,45,45,44,45,42]), kpi("Website sessions", "86.3K", "+12.4%", "up", true, "last 30 days", [61,63,64,66,68,70,71,74,75,77,77,86]), kpi("Lead → opportunity", "14.2%", "+0.8 pts", "up", true, "conversion, trailing 30d", [12.1,12.4,12.6,12.8,13,13.1,13.3,13.4,13.6,13.7,13.4,14.2])],
      main: { type: "line", title: "Leads by channel (weekly)", w: 8, unit: "#", labels: WEEKS, series: [{ name: "Organic", data: leadsOrganic }, { name: "Paid", data: leadsPaid }, { name: "Referral", data: leadsRef }] },
      side: { type: "donut", title: "Spend by channel", w: 4, labels: ["Paid search","Social","Events","Content","Email"], data: [38,24,18,12,8] },
      table: { type: "table", title: "Active campaigns", w: 8, columns: ["Campaign","Channel","Spend","Leads","CPL","Status"], rows: [["Fall Launch — search","Paid search","$18.2K","412","$44","good"],["Retarget: pricing page","Social","$6.1K","188","$32","good"],["Ops Summit sponsorship","Events","$14.0K","96","$146","warn"],["Buyer's guide (gated)","Content","$3.4K","171","$20","good"],["Reactivation drip","Email","$900","74","$12","good"],["LinkedIn thought leadership","Social","$5.2K","41","$127","crit"]] },
      list: { type: "list", title: "Marketing watch-list", w: 4, items: [{ text: "LinkedIn CPL is 3× target — pause or rework creative", status: "crit", meta: "today" }, { text: "Fall Launch landing page converting at 6.8% (best ever)", status: "good", meta: "2d" }, { text: "Event leads from Ops Summit not yet routed to sales", status: "warn", meta: "4d" }, { text: "Q4 content calendar due for review Friday", status: "info", meta: "Fri" }] },
      bar: { type: "bar", title: "Leads by source (this month)", w: 6, unit: "#", labels: ["Organic","Paid search","Social","Referral","Events","Email"], series: [{ name: "Leads", data: [468,412,229,146,96,74] }] } },

  };
  const ORDER = ["sales","marketing","support","finance","people","ops","inventory","product","success"];

  // =====================================================================
  //  PLANNING ENGINE — request → plan → dashboard spec
  // =====================================================================
  const norm = (s) => " " + String(s || "").toLowerCase().replace(/[^a-z0-9&'’ -]/g, " ").replace(/\s+/g, " ") + " ";
  function domainHits(text) {
    // [{key, pos}] ordered by where the domain is first mentioned in the request
    const t = norm(text); const found = [];
    for (const k of ORDER) { const d = D[k]; let pos = Infinity; for (const key of d.keys) { const re = new RegExp("(^| )" + key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(s|es)?( |$)"); const m = re.exec(t); if (m && m.index < pos) pos = m.index; } if (pos < Infinity) found.push({ key: k, pos }); }
    return found.sort((a, b) => a.pos - b.pos);
  }
  function detectDomains(text) { return domainHits(text).map((x) => x.key); }
  function splitAddRemove(text) {
    // domains mentioned after a remove-verb are removals, until an add-verb appears
    const t = norm(text); const verbs = [];
    const re = /(^| )(remove|drop|hide|get rid of|without|take out|delete|add|include|also|show|plus|bring in|put in)( |$)/g; let m;
    while ((m = re.exec(t))) verbs.push({ pos: m.index, kind: /remove|drop|hide|get rid of|without|take out|delete/.test(m[2]) ? "remove" : "add" });
    const add = [], remove = [];
    for (const h of domainHits(text)) { let kind = "add"; for (const v of verbs) if (v.pos < h.pos) kind = v.kind; (kind === "remove" ? remove : add).push(h.key); }
    return { add, remove };
  }
  function detectRole(text) {
    const s = String(text || "").replace(/\s+/g, " ").trim();
    const pats = [
      /(?:dashboard|view|overview|report|page)\s+for\s+(?:a|an|the|our|my)?\s*([^,.;:!?]+?)(?=\s+(?:at|in|who|that|which|covering|tracking|managing|responsible|with|needing|needs|wants|looking|to see|to track|to monitor|showing|that shows|for)\b|[,.;:!?]|$)/i,
      /\bfor\s+(?:a|an|the|our|my)\s+([^,.;:!?]+?)(?=\s+(?:at|in|who|that|which|covering|tracking|managing|responsible|with|needing|needs|wants|looking|to see|to track|to monitor|showing|that shows)\b|[,.;:!?]|$)/i,
      /\b(?:i am|i'm|as|as a|as an)\s+(?:a|an|the)?\s*([^,.;:!?]+?)(?=\s+(?:at|in|who|that|which|and|covering|tracking|managing|with|needing|looking)\b|[,.;:!?]|$)/i,
      /^(?:a|an|the)\s+([^,.;:!?]+?)(?=\s+(?:at|in|who|that|which|covering|tracking|managing|responsible|with|needing|needs|wants|looking|to see|to track|to monitor|showing)\b|[,.;:!?]|$)/i
    ];
    for (const re of pats) { const m = s.match(re); if (m) { let r = m[1].trim().replace(/^(?:build|create|make|design|show me|give me)\s+/i, "").replace(/\s+(?:instead|please|now|today)$/i, ""); if (r && !/dashboard|report|chart|widget|data/i.test(r) && r.split(" ").length <= 7) return r; } }
    return null;
  }
  function detectCompany(text) {
    const m = String(text || "").match(/\bat\s+((?:[A-Z][\w&'’.-]*)(?:\s+(?:[A-Z][\w&'’.-]*|of|and|&|the))*)/);
    if (!m) return null; let c = m[1].replace(/\s+(?:who|that|which|and|the|of|&)$/i, "").trim(); return c.split(" ").length <= 5 ? c : null;
  }
  const titleCase = (s) => s.replace(/\b([a-z])/g, (m) => m.toUpperCase()).replace(/\b(Of|And|The|For|At|In|Vp|Ceo|Coo|Cfo|Cmo|Cto|Hr|It|Cx|Cs)\b/g, (m) => ({ Of: "of", And: "and", The: "the", For: "for", At: "at", In: "in", Vp: "VP", Ceo: "CEO", Coo: "COO", Cfo: "CFO", Cmo: "CMO", Cto: "CTO", Hr: "HR", It: "IT", Cx: "CX", Cs: "CS" }[m]));

  function roleDomains(role) {
    const r = norm(role);
    if (/\b(ceo|founder|owner|president|general manager|executive|managing director|coo|gm)\b/.test(r)) return ["sales","finance","people"];
    if (/\b(cfo|controller|accountant|finance)\b/.test(r)) return ["finance","sales"];
    if (/\b(cmo|growth|marketing)\b/.test(r)) return ["marketing","sales"];
    if (/\b(cto|engineer|engineering|developer|product)\b/.test(r)) return ["product","support"];
    if (/\b(revenue|revops|rev ops)\b/.test(r)) return ["sales","marketing","success"];
    if (/\b(customer experience|cx)\b/.test(r)) return ["support","success","sales"];
    if (/\b(store|retail|shop)\b/.test(r)) return ["sales","inventory","people"];
    if (/\b(sales|account)\b/.test(r)) return ["sales"];
    if (/\b(support|service|helpdesk)\b/.test(r)) return ["support"];
    if (/\b(hr|people|talent|recruit\w*)\b/.test(r)) return ["people"];
    if (/\b(ops|operations|warehouse|logistics|plant)\b/.test(r)) return ["ops"];
    return [];
  }

  function plan(text, prev) {
    const t = norm(text);
    const domains = detectDomains(text);
    const bonusAsk = /anything else|what else|anything you think|you think|useful|helpful|missing|improve|suggest|recommend|more insight|insights|make it better|add more|else/.test(t);
    const removeAsk = /(^| )(remove|drop|hide|get rid of|without|take out|delete)( |$)/.test(t);
    const simplerAsk = /simpler|simplify|fewer|less busy|too much|minimal|clean up|condense/.test(t);
    const role = detectRole(text), company = detectCompany(text);
    const looksNew = !prev || /(^| )(dashboard|view) for( |$)/.test(t) || (role && role.toLowerCase() !== (prev.role || "").toLowerCase() && domains.length >= 1 && !/(^| )(add|include|also|show|plus|and|remove|drop|hide)( |$)/.test(t.slice(0, 12)));
    let p;
    if (!prev || looksNew) {
      let ds = domains.slice();
      const rd = role ? roleDomains(role) : [];
      // the person's own function leads the dashboard
      if (rd.length && ds.includes(rd[0])) ds = [rd[0], ...ds.filter((d) => d !== rd[0])];
      rd.forEach((d) => { if (!ds.includes(d)) ds.push(d); });
      if (!ds.length) ds = ["sales","finance","support"];
      p = { role: role ? titleCase(role) : null, company, domains: ds.slice(0, 5), bonus: bonusAsk && !domains.length, compact: simplerAsk, changes: ["new"], explicitRole: !!role };
    } else {
      p = { ...prev, domains: prev.domains.slice(), changes: [] };
      const { add, remove } = removeAsk ? splitAddRemove(text) : { add: domains, remove: [] };
      if (remove.length) { p.domains = p.domains.filter((d) => !remove.includes(d)); p.changes.push("removed:" + remove.join(",")); }
      const added = add.filter((d) => !p.domains.includes(d)); if (added.length) { p.domains.push(...added); p.changes.push("added:" + added.join(",")); }
      if (!p.domains.length) p.domains = ["sales"];
      if (bonusAsk) { p.bonus = true; p.changes.push("bonus"); }
      if (simplerAsk) { p.compact = true; p.changes.push("compact"); }
      if (/bring back|not simpler|more detail|expand/.test(t)) { p.compact = false; p.changes.push("expand"); }
      if (role && !p.explicitRole) { p.role = titleCase(role); p.explicitRole = true; p.changes.push("role"); }
      if (company) p.company = company;
      if (!p.changes.length) { p.bonus = true; p.changes.push("bonus"); }
      p.domains = p.domains.slice(0, 6);
    }
    return p;
  }

  const clone = (o) => JSON.parse(JSON.stringify(o));
  function compose(p) {
    const ds = p.domains.map((k) => D[k]).filter(Boolean);
    const primary = ds[0];

{"type":"donut","title":"...","w":4,"labels":[3-5],"data":[...]}
{"type":"table","title":"...","w":8,"columns":["Name","Owner","Value","Status"],"rows":[[...4-5 rows...]]}  (a cell equal to good/warn/crit/info/neutral renders as a status tag)
{"type":"list","title":"Needs attention","w":4,"items":[{"text":"...","status":"good|warn|crit|info","meta":"2h ago"} x3-4]}
{"type":"progress","title":"Goals","w":6,"items":[{"label":"...","value":72,"target":100,"unit":"%"} x3]}
{"type":"insights","title":"What the agent noticed","w":12,"items":[{"k":"Sales","t":"one specific, data-backed observation with a recommendation","tone":"good|warn|crit"} x3]}
{"type":"todo","title":"Priorities today","w":4,"items":["short action", ...4]}

Rules:
- Start with a row of 4 KPIs (w:3 each): the numbers this person checks first. "good" = whether the trend direction is good news for them.
- Then, per area they asked about, one main chart (w:8) beside a donut/bar/list (w:4); use "section" labels when the request spans several areas (e.g. Sales, Marketing, Customer Service). Include at least one table and one list of things needing attention.
- Data must agree with itself (KPI values match chart totals, donut shares make sense), with plausible trends and concrete labels (real months/weekdays, named products, people, regions). KPI "value" is a preformatted string ($1.24M, 94.2%, 3h 12m).
- Keep strings concise. Never repeat the same names or numbers across different requests — tailor everything to this person.
- On a follow-up, return the COMPLETE updated dashboard (all widgets), changing only what was asked and keeping the rest identical. If asked what else would be useful, ADD 3-4 genuinely useful widgets for this role (an insights panel, a forecast, priorities, goals) under a section "Also useful" and say what you added in "summary". If the follow-up describes a different person, start fresh.`;
  const TYPES = new Set(["kpi","line","bar","donut","table","list","progress","insights","todo"]);
  let turns = [];   // [{role, content}] — the last two exchanges, kept by the page
  function sanitize(out) {
    if (!out || typeof out !== "object" || !Array.isArray(out.widgets)) return null;
    const widgets = out.widgets.filter((w) => w && typeof w === "object" && TYPES.has(w.type) && typeof w.title === "string").map((w) => { const c = { ...w }; c.w = [3,4,6,8,12].includes(Number(c.w)) ? Number(c.w) : (c.type === "kpi" ? 3 : c.type === "insights" ? 12 : 4); if (typeof c.section !== "string") delete c.section; return c; });
    if (widgets.length < 4) return null;
    return { title: String(out.title || "Dashboard"), subtitle: String(out.subtitle || ""), persona: { role: String((out.persona && out.persona.role) || ""), company: String((out.persona && out.persona.company) || ""), focus: String((out.persona && out.persona.focus) || "") }, rationale: String(out.rationale || ""), summary: String(out.summary || ""), accent: out.accent, widgets };
  }
  async function claudeSpec(text, followUp, signal) {
    const request = followUp ? `Follow-up request: ${text}` : `Request: ${text}`;
    let out = null;
    if (sample) {
      try { out = await sample.json([{ role: "user", content: RULES }, ...turns, { role: "user", content: request }], { modelTier: "quick", cache: false, signal }); }
      catch (e) { if (e && (e.code === "not_granted" || e.code === "sampling_disabled" || e.code === "not_declared" || e.code === "capability_disabled")) sample = null; console.warn("sample", e); return null; }
    } else if (apiOk) {
      try {
        const r = await fetch("/api/plan", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ system: RULES, messages: [...turns, { role: "user", content: request }] }), signal });
        if (r.status === 404) { apiOk = false; return null; } if (!r.ok) { console.warn("api", r.status, await r.text()); return null; }
        out = await r.json();
      } catch (e) { console.warn("api", e); return null; }
    } else return null;
    const spec = sanitize(out); if (!spec) { console.warn("bad spec", out); return null; }
    turns.push({ role: "user", content: request }, { role: "assistant", content: JSON.stringify(spec) });
    while (turns.length > 4) turns.splice(0, 2);
    return spec;
  }

  async function build(text) {
    text = (text || "").trim(); if (!text || busy) return;
    busy = true; sendBtn.disabled = true; input.value = ""; autosize();
    const followUp = !!current;
    const steps = followUp ? ["Reading your change", "Redesigning the layout", "Regenerating data", "Finishing"] : ["Reading the brief", "Deciding what they check first", "Choosing charts & layout", "Generating data", "Finishing"];
    const step = showSteps(steps); let si = 0;
    const live = !!(sample || apiOk);
    const ticker = setInterval(() => { if (si < steps.length - 1) { si++; step(si); } }, live ? 2600 : 550);
    setStatus("building", true); dash.classList.add("dim");
    const t0 = performance.now();
    let s = null, viaClaude = false;
    if (live) {
      const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 45000);
      s = await claudeSpec(text, followUp, ctl.signal); clearTimeout(timer);
      viaClaude = !!s;
    }
    let p = current;
    if (!s) {   // safety net: the built-in planner never fails
      await sleep(live ? 0 : 900);
      p = plan(text, current); s = compose(p); s.summary = followUp ? changeSummary(p, s).replace(/<[^>]+>/g, "") : "";
      turns = [{ role: "user", content: followUp ? `Follow-up request: ${text}` : `Request: ${text}` }, { role: "assistant", content: JSON.stringify(s) }];
    } else { p = current || { domains: [] }; }
    clearInterval(ticker); step(steps.length);
    spec = s; current = p;
    render(spec, viaClaude);
    dash.classList.remove("dim"); setStatus(live ? "agent ready · claude connected" : "agent ready", true);
    $("#h1").textContent = "Want to change anything?"; $("#lead").textContent = "Ask in plain English — add an area, remove one, or ask what else would be useful."; input.placeholder = "e.g. add marketing · remove the tables · add anything else you think may be useful"; $("#reset").hidden = false;
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    busy = false; sendBtn.disabled = false; input.focus();   // accept the next request while the reply is still typing
    setTimeout(() => { if (!followUp) dash.scrollIntoView({ behavior: "smooth", block: "start" }); }, 200);
    const lead = followUp ? (spec.summary ? `<b>Done</b> — ${esc(spec.summary.replace(/^done\s*[—-]\s*/i, ""))} ` : `<b>Updated</b> — ${spec.widgets.length} widgets. `) : `<b>Built for ${esc(spec.persona.role || "you")}</b> — ${spec.widgets.length} widgets in ${secs}s. `;
    type(lead + (followUp ? "" : esc(spec.rationale)), followUp ? 7 : 8);
  }

  // ---------- wiring ----------
  function autosize() { input.style.height = "auto"; input.style.height = Math.min(180, input.scrollHeight) + "px"; }
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); build(input.value); } });
  sendBtn.addEventListener("click", () => build(input.value));
  $("#reset").addEventListener("click", () => { current = null; spec = null; turns = []; dash.hidden = true; grid.innerHTML = ""; head.innerHTML = ""; reply.hidden = true; $("#h1").textContent = "Who is this dashboard for?"; $("#lead").textContent = "Describe the person and what they need to keep an eye on. The agent designs the rest."; input.placeholder = "e.g. A sales manager who needs to see sales, marketing, and open customer service tickets"; $("#reset").hidden = true; input.focus(); window.scrollTo({ top: 0, behavior: "smooth" }); });
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) { const mic = $("#mic"); mic.hidden = false; let rec = null;
    mic.addEventListener("click", () => { if (rec) { rec.stop(); return; }
      try { rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.continuous = false; let finalText = "";
        rec.onresult = (ev) => { let interim = ""; for (const r of ev.results) { if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript; } input.value = (finalText + " " + interim).trim(); autosize(); };
        rec.onerror = (ev) => { mic.classList.remove("rec"); rec = null; if (ev.error === "not-allowed" || ev.error === "service-not-allowed") { mic.hidden = true; toast("Microphone isn't available here — type instead."); } };
        rec.onend = () => { mic.classList.remove("rec"); rec = null; if (finalText.trim()) build(finalText); };
        rec.start(); mic.classList.add("rec"); toast("Listening… speak the request, then pause."); } catch (e) { mic.hidden = true; rec = null; } }); }

  // connect Claude if this viewer has it (never required)
  (async () => { try { sample = window.claude ? await claude.use("sample") : null; } catch (e) { sample = null; } if (apiOk) { try { const r = await fetch("/api/plan", { method: "GET" }); apiOk = r.ok; } catch (e) { apiOk = false; } } setStatus(sample || apiOk ? "agent ready · claude connected" : "agent ready", true); })();
  window.__vantage = { plan, compose, D };
})();
